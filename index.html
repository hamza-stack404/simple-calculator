<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class=" w-200 mx-auto border border-2px ">
        <input type="text" name="" id="display" class="w-200 mx-auto h-20 text-right text-4xl p-4 mb-10" disabled>
        <div class="flex flex-row-reverse p-4">
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="back()">B</button>
        </div>
        <div class="flex justify-center justify-between gap-30 mb-9">
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(1)">1</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(2)">2</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(3)">3</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert('+')">+</button>
        </div>
        <div class="flex justify-center justify-between gap-30 mb-10">
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(4)">4</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(5)">5</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(6)">6</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert('-')">-</button>
        </div>
        <div class="flex justify-center justify-between gap-30 mb-10">
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(7)">7</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(8)">8</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(9)">9</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert('*')">X</button>
        </div>
        <div class="flex justify-center justify-between gap-30 mb-10">
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="clean()">C</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert(0)">0</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="equal()">=</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert('/')">/</button>
            <button class = "bg-gray-300 hover:bg-gray-400 text-black font-bold py-2 px-4 rounded" onclick="insert('.')">.</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
